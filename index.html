          font-size:1.15rem;
          color:var(--ink-dim);
          max-width:58ch;
          line-height:1.6;
        }
        .lede strong{color:var(--ink); font-weight:600;}

        .terminal{
          margin-top:3rem;
          background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
          border:1px solid var(--line);
          border-radius:10px;
          box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(142,255,183,0.06) inset;
          overflow:hidden;
        }
        .terminal-bar{
          display:flex; align-items:center; gap:0.45rem;
          padding:0.7rem 1rem;
          background:#0E1A15;
          border-bottom:1px solid var(--line);
        }
        .dot{width:9px;height:9px;border-radius:50%; opacity:0.9}
        .dot.r{background:#FF6B5A;} .dot.y{background:#FFC95A;} .dot.g{background:#5CFF95;}
        .terminal-title{
          margin-left:0.6rem;
          font-family:'IBM Plex Mono', monospace;
          font-size:0.72rem;
          color:var(--ink-faint);
          letter-spacing:0.02em;
        }
        .terminal-body{
          padding:1.6rem 1.5rem 1.7rem;
          font-family:'IBM Plex Mono', monospace;
          font-size:0.88rem;
          line-height:1.7;
        }
        .terminal-body .prompt{color:var(--green);}
        .terminal-body .out{color:var(--ink-faint);}
        .terminal-body .field{color:var(--amber); margin-top:0.85rem; font-size:0.78rem; letter-spacing:0.04em; text-transform:uppercase;}
        .terminal-body .val{color:var(--ink); font-size:0.92rem;}
        .cursor{display:inline-block; width:7px; height:1rem; background:var(--green); margin-left:3px; animation:blink 1s steps(1) infinite; vertical-align:text-bottom;}
        @keyframes blink{50%{opacity:0}}

        main{padding:3.5rem 0 2rem;}
        section{margin-bottom:4.5rem;}
        h2{
          font-family:'IBM Plex Mono', monospace;
          font-size:0.78rem;
          letter-spacing:0.18em;
          text-transform:uppercase;
          color:var(--green-dim);
          margin:0 0 1.5rem;
          display:flex; align-items:center; gap:0.7rem;
        }
        h2::before{
          content:"";
          width:22px; height:1px; background:var(--line-bright); display:inline-block;
        }

        .prose p{color:var(--ink-dim); font-size:1.05rem; margin:0 0 1.1rem;}
        .prose strong{color:var(--ink); font-weight:600;}

        .steps{
          display:grid;
          grid-template-columns:repeat(3,1fr);
          gap:1.25rem;
          margin:2.2rem 0 2.5rem;
        }
        .step{
          background:var(--bg-panel);
          border:1px solid var(--line);
          border-radius:10px;
          padding:1.2rem 1.2rem 1.3rem;
        }
        .step-num{
          font-family:'IBM Plex Mono', monospace;
          font-size:0.75rem;
          letter-spacing:0.15em;
          color:var(--green);
          border:1px solid var(--line-bright);
          display:inline-block;
          padding:0.15rem 0.5rem;
          border-radius:20px;
          margin-bottom:0.9rem;
        }
        .step h3{
          font-family:'Source Serif 4', serif;
          font-size:1.05rem;
          font-weight:600;
          margin:0 0 0.35rem;
          color:var(--ink);
        }
        .step p{font-size:0.92rem; line-height:1.6; margin:0; color:var(--ink-dim);}

        .report-mock{
          background:var(--bg-panel);
          border:1px solid var(--line-bright);
          border-radius:10px;
          overflow:hidden;
        }
        .report-mock-bar{
          display:flex; align-items:center; gap:0.45rem;
          padding:0.6rem 1rem;
          background:#0E1A15;
          border-bottom:1px solid var(--line);
          font-family:'IBM Plex Mono', monospace;
          font-size:0.72rem;
          color:var(--ink-faint);
        }
        .report-mock-body{
          padding:1.4rem 1.5rem;
          font-family:'IBM Plex Mono', monospace;
          font-size:0.85rem;
          line-height:1.7;
        }
        .report-mock-body .field{color:var(--ink-faint); font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; margin-top:0.9rem;}
        .report-mock-body .field:first-child{margin-top:0;}
        .report-mock-body .val{color:var(--ink);}
        .report-mock-body .val.accent{color:var(--green);}

        details.legal{
          background:var(--bg-panel);
          border:1px solid var(--line);
          border-radius:10px;
          margin-bottom:1rem;
          overflow:hidden;
        }
        details.legal summary{
          font-family:'IBM Plex Mono', monospace;
          font-size:0.82rem;
          padding:1rem 1.2rem;
          cursor:pointer;
          list-style:none;
          color:var(--ink-dim);
          display:flex;
          align-items:center;
          justify-content:space-between;
        }
        details.legal summary::-webkit-details-marker{display:none;}
        details.legal summary::after{content:"+"; font-size:1.2rem; color:var(--green-dim);}
        details.legal[open] summary::after{content:"–";}
        details.legal[open] summary{border-bottom:1px solid var(--line); color:var(--ink);}
        .legal-body{
          padding:1.2rem 1.2rem 1.4rem;
          font-size:0.95rem;
          color:var(--ink-dim);
        }
        .legal-body ul{padding-left:1.2rem; margin:0.6rem 0 1rem;}
        .legal-body li{margin-bottom:0.4rem;}
        .legal-body a{
          color:var(--green);
          text-decoration:none;
          border-bottom:1px solid rgba(142,255,183,0.3);
          padding-bottom:1px;
        }
        .legal-body a:hover{border-bottom-color:var(--green);}

        .contact-card{
          background:var(--bg-panel);
          border:1px solid var(--line);
          border-radius:10px;
          padding:1.5rem;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:1rem;
          flex-wrap:wrap;
        }
        .contact-card p{margin:0; color:var(--ink-dim); font-size:0.98rem; max-width:32ch;}
        .contact-btn{
          font-family:'IBM Plex Mono', monospace;
          font-size:0.85rem;
          background:var(--green);
          color:#07110C;
          padding:0.65rem 1rem;
          border-radius:7px;
          text-decoration:none;
          font-weight:600;
          letter-spacing:0.01em;
          transition:transform 0.15s ease, background 0.15s ease;
          display:inline-block;
          white-space:nowrap;
        }
        .contact-btn:hover{background:#A8FFC5; transform:translateY(-1px);}

        footer{
          border-top:1px solid var(--line);
          padding:1.6rem 0 3rem;
          font-family:'IBM Plex Mono', monospace;
          font-size:0.72rem;
          color:var(--ink-faint);
          display:flex;
          justify-content:space-between;
          flex-wrap:wrap;
          gap:0.8rem;
          position:relative;
          z-index:1;
        }
        footer a{color:var(--ink-faint); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:1px;}
        footer a:hover{color:var(--ink-dim);}

        @media(max-width:700px){
          header{padding:4.5rem 0 2rem;}
          .steps{grid-template-columns:1fr;}
          .wrap{padding:0 1.25rem;}
        }
