  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap');

  :root{
    --bg: #0A1310;
    --bg-panel: #121E18;
    --bg-panel-2: #16261E;
    --line: #213A2B;
    --line-bright: #2E5A3E;
    --green: #8EFFB7;
    --green-dim: #5C8A6E;
    --magenta: #E0A6FF;
    --cyan: #7DE8FF;
    --ink: #E6EDE8;
    --ink-dim: #9FB0A6;
    --ink-faint: #6B7F76;
    --amber: #FFC978;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    line-height:1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle vignette + grain, not tron grid */
  .backdrop{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
      radial-gradient(90% 70% at 50% 0%, rgba(142,255,183,0.12), transparent 55%),
      radial-gradient(60% 40% at 85% 20%, rgba(224,166,255,0.08), transparent 50%),
      var(--bg);
  }
  .backdrop::after{
    content:"";
    position:absolute;
    inset:0;
    opacity:0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events:none;
  }

  .wrap{max-width:800px; margin:0 auto; padding:0 1.75rem;}

  header{
    padding:6.5rem 0 3rem;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--green);
  }
  h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.6rem);
    line-height:1.05;
    letter-spacing:-0.02em;
    margin:1.2rem 0 1.2rem;
    max-width:16ch;
  }
  h1 em{
    font-style:italic;
    font-weight:600;
    color:var(--ink);
    position:relative;
  }
  h1 em::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0.08em;
    height:0.28em;
    background:linear-gradient(90deg, rgba(142,255,183,0.35), rgba(224,166,255,0.25));
    z-index:-1;
  }
  .lede{
    font-size:1.15rem;
    color:var(--ink-dim);
    max-width:58ch;
    line-height:1.6;
  }
  .lede strong{color:var(--ink); font-weight:600;}

  /* Terminal - keep as signature, but cleaner */
  .terminal{
    margin-top:3rem;
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(142,255,183,0.06) inset;
    overflow:hidden;
  }
  .terminal-bar{
    display:flex; align-items:center; gap:0.45rem;
    padding:0.7rem 1rem;
    background:#0E1A15;
    border-bottom:1px solid var(--line);
  }
  .dot{width:9px;height:9px;border-radius:50%; opacity:0.9}
  .dot.r{background:#FF6B5A;} .dot.y{background:#FFC95A;} .dot.g{background:#5CFF95;}
  .terminal-title{
    margin-left:0.6rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ink-faint);
    letter-spacing:0.02em;
  }
  .terminal-body{
    padding:1.6rem 1.5rem 1.7rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.88rem;
    line-height:1.7;
  }
  .terminal-body .prompt{color:var(--green);}
  .terminal-body .out{color:var(--ink-faint);}
  .terminal-body .field{color:var(--amber); margin-top:0.85rem; font-size:0.78rem; letter-spacing:0.04em; text-transform:uppercase;}
  .terminal-body .val{color:var(--ink); font-size:0.92rem;}
  .cursor{display:inline-block; width:7px; height:1rem; background:var(--green); margin-left:3px; animation:blink 1s steps(1) infinite; vertical-align:text-bottom;}
  @keyframes blink{50%{opacity:0}}

  main{padding:3.5rem 0 2rem;}
  section{margin-bottom:4.5rem;}
  h2{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--green-dim);
    margin:0 0 1.5rem;
    display:flex; align-items:center; gap:0.7rem;
  }
  h2::before{
    content:"";
    width:22px; height:1px; background:var(--line-bright); display:inline-block;
  }

  .prose p{color:var(--ink-dim); font-size:1.05rem; margin:0 0 1.1rem;}
  .prose strong{color:var(--ink); font-weight:600;}

  /* Steps */
  .steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1.25rem;
    margin:2.2rem 0 2.5rem;
  }
  .step{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:1.2rem 1.2rem 1.3rem;
  }
  .step-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    letter-spacing:0.15em;
    color:var(--green);
    border:1px solid var(--line-bright);
    display:inline-block;
    padding:0.15rem 0.5rem;
    border-radius:20px;
    margin-bottom:0.9rem;
  }
  .step h3{
    font-family:'Source Serif 4', serif;
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 0.35rem;
    color:var(--ink);
  }
  .step p{font-size:0.92rem; line-height:1.6; margin:0; color:var(--ink-dim);}

  /* Report mock - more readable */
  .report-mock{
    background:var(--bg-panel);
    border:1px solid var(--line-bright);
    border-radius:10px;
    overflow:hidden;
  }
  .report-mock-bar{
    display:flex; align-items:center; gap:0.45rem;
    padding:0.6rem 1rem;
    background:#0E1A15;
    border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ink-faint);
  }
  .report-mock-body{
    padding:1.4rem 1.5rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.84rem;
    line-height:1.8;
  }
  .report-mock-body .field{color:var(--ink-faint); font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; margin-top:0.8rem;}
  .report-mock-body .field:first-child{margin-top:0;}
  .report-mock-body .val{color:var(--ink);}
  .report-mock-body .val.accent{color:var(--green);}

  /* Legal - collapsible so it doesn't dominate */
  details.legal{
    background:transparent;
    border:1px solid var(--line);
    border-radius:10px;
    padding:0;
    overflow:hidden;
  }
  details.legal + details.legal{margin-top:0.9rem;}
  details.legal summary{
    list-style:none;
    cursor:pointer;
    padding:1rem 1.25rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    color:var(--ink-dim);
    display:flex; justify-content:space-between; align-items:center;
  }
  details.legal summary::-webkit-details-marker{display:none;}
  details.legal summary::after{content:"+"; color:var(--green-dim); font-size:1.1rem;}
  details.legal[open] summary::after{content:"—";}
  details.legal .legal-body{
    padding:0 1.25rem 1.25rem;
    font-size:0.9rem;
    color:var(--ink-dim);
    border-top:1px solid var(--line);
    margin-top:0;
  }
  details.legal .legal-body p, details.legal .legal-body li{font-size:0.9rem; line-height:1.65;}
  details.legal .legal-body strong{color:var(--ink);}

  /* Contact */
  .contact-card{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line-bright);
    border-radius:12px;
    padding:1.6rem 1.5rem;
    display:flex;
    flex-wrap:wrap;
    gap:1rem;
    align-items:center;
    justify-content:space-between;
  }
  .contact-card p{margin:0; color:var(--ink-dim); font-size:0.98rem;}
  .contact-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    letter-spacing:0.04em;
    background:var(--ink);
    color:var(--bg);
    padding:0.75rem 1.1rem;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
    transition:transform 0.12s ease, background 0.12s ease;
    display:inline-block;
  }
  .contact-btn:hover{transform:translateY(-1px); background:#ffffff;}

  footer{
    padding:2.5rem 0 4rem;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ink-faint);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.8rem;
  }
  footer a{color:var(--ink-faint); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:1px;}
  footer a:hover{color:var(--ink-dim);}

  @media(max-width:700px){
    header{padding:4.5rem 0 2rem;}
    .steps{grid-template-columns:1fr;}
    .wrap{padding:0 1.25rem;}
  }
